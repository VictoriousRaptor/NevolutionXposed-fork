buildscript {
	ext.gradle_version = '9.1.1'

	repositories {
		google()
		mavenCentral()
	}

	dependencies {
		classpath "com.android.tools.build:gradle:$gradle_version"
	}
}

repositories {
	google()
	mavenCentral()
}

def releaseSigningKeys = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
def releaseSigningConfigured = releaseSigningKeys.every { providers.gradleProperty(it).isPresent() }
if (providers.gradleProperty('requireReleaseSigning').orNull == 'true' && !releaseSigningConfigured) {
	throw new GradleException('Release signing is required. Configure RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD.')
}
if (!releaseSigningConfigured) {
	logger.warn('Release signing is not configured: debug uses the default debug key and cannot replace a release-signed installation.')
}

if (! project.plugins.hasPlugin("com.android.feature")) apply plugin: 'com.android.application'

android {
	namespace 'com.oasisfeng.nevo.xposed'
	compileSdk 37
	compileSdkMinor 0

	defaultConfig {
		minSdk 26
		targetSdk 34
		versionCode 10
		versionName "3.1.2"
		testInstrumentationRunner "com.oasisfeng.nevo.decorators.wechat.MessageIdentityInstrumentation"
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}

	buildFeatures {
		buildConfig = true
	}

	signingConfigs {
		release {
			if (releaseSigningConfigured) {
				storeFile file(providers.gradleProperty('RELEASE_STORE_FILE').get())
				storePassword providers.gradleProperty('RELEASE_STORE_PASSWORD').get()
				keyAlias providers.gradleProperty('RELEASE_KEY_ALIAS').get()
				keyPassword providers.gradleProperty('RELEASE_KEY_PASSWORD').get()
			}
		}
	}

	buildTypes {
		release {
			signingConfig signingConfigs.release
		}
		debug {
			if (releaseSigningConfigured) signingConfig signingConfigs.release
			debuggable true
			minifyEnabled false
		}
	}

	sourceSets {
		main.kotlin.srcDirs += 'src/main/kotlin'
	}
}

dependencies {
	compileOnly 'io.github.libxposed:api:102.0.0'
	implementation 'io.github.libxposed:service:102.0.0'
	implementation 'androidx.core:core:1.12.0'
	implementation 'androidx.annotation:annotation:1.7.1'
	implementation 'androidx.palette:palette:1.0.0'
	implementation 'androidx.appcompat:appcompat:1.6.1'
	implementation 'androidx.preference:preference:1.2.1'
	testImplementation 'junit:junit:4.13.2'
}
